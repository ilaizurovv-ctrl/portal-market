name: Build Losgram APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'losgram/android/**'
      - '.github/workflows/build-losgram-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: losgram/android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Losgram-Android-APK
          path: losgram/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
