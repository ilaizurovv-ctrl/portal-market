<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111e2e"><title>Losgram</title><style>
:root{--bg:#0d1725;--panel:#142337;--line:#293c50;--muted:#91a4b8;--blue:#398fe5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font:15px system-ui}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.hidden{display:none!important}.muted{color:var(--muted)}.auth{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#1d4264,transparent 60%),var(--bg)}.authbox{width:min(100%,400px);background:#15263a;padding:30px;border:1px solid #2a4058;border-radius:24px}.logo{text-align:center;font-size:30px;font-weight:850}.authbox p{text-align:center;color:var(--muted)}.field{width:100%;padding:14px;margin:7px 0;border-radius:12px;background:#0c1929;border:1px solid #2a4058;color:white}.primary{width:100%;padding:14px;border-radius:12px;background:var(--blue);font-weight:750;margin-top:9px}.link{display:block;background:none;color:#83bfff;margin:16px auto}.app{height:100dvh;display:grid;grid-template-columns:68px 340px minmax(0,1fr);background:var(--panel);overflow:hidden}.rail{background:#101c2b;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 8px;gap:12px}.mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(140deg,#5bbaff,#2676d1);display:grid;place-items:center;font-size:23px;font-weight:bold;margin-bottom:18px}.nav{width:46px;height:46px;border-radius:14px;background:none;color:#9bb0c6;font-size:20px}.nav.active,.nav:hover{background:#24415e;color:#8fc7ff}.nav.bottom{margin-top:auto}.side{min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#122135}.sidehead{display:flex;align-items:center;justify-content:space-between;padding:20px}.sidehead h2{margin:0;font-size:22px}.icon{width:38px;height:38px;border-radius:12px;background:#203951;font-size:20px}.search{margin:0 14px 12px;padding:12px;border-radius:12px;background:#0d1b2b;border:1px solid var(--line);color:white}.tabs{display:flex;gap:6px;padding:0 14px 12px}.tab{padding:8px 12px;border-radius:10px;background:none;color:var(--muted);font-size:13px}.tab.active{background:#24415e;color:#9acfff}.list{overflow:auto;flex:1;padding:0 8px}.person{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:none;text-align:left}.person:hover,.person.selected{background:#20384f}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#547fa8,#315575);font-weight:bold}.info{min-width:0;flex:1}.name{font-weight:700}.preview{font-size:13px;color:var(--muted);margin-top:4px}.empty{text-align:center;color:var(--muted);padding:30px 15px;line-height:1.6}.workspace{min-width:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at center,#172c40,#101d2d 80%)}.welcome{margin:auto;text-align:center;max-width:360px;padding:24px}.welcome .mark{margin:0 auto 18px;width:82px;height:82px;font-size:36px;border-radius:28px}.welcome p{color:var(--muted);line-height:1.6}.chathead{height:72px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#142438;border-bottom:1px solid var(--line)}.chathead .avatar{width:43px;height:43px}.chatwho{flex:1}.chatwho small{display:block;color:var(--green,#50c89c);margin-top:3px}.back{display:none;background:none;font-size:24px}.messages{flex:1;overflow:auto;padding:22px clamp(12px,5vw,65px);display:flex;flex-direction:column;gap:10px}.bubble{max-width:min(75%,540px);padding:11px 14px;background:#20364b;border-radius:15px 15px 15px 5px;overflow-wrap:anywhere;line-height:1.5}.bubble.mine{align-self:flex-end;background:#285b89;border-radius:15px 15px 5px 15px}.time{font-size:10px;color:#bfd0df;text-align:right;margin-top:5px}.composer{display:flex;gap:10px;padding:13px 16px calc(13px + env(safe-area-inset-bottom));background:#142438;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0;padding:13px 17px;border-radius:24px;background:#0d1b2b;border:1px solid var(--line);color:white}.send{width:47px;height:47px;border-radius:50%;background:var(--blue);font-size:19px}.page{padding:25px;overflow:auto}.row{padding:16px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.row small{display:block;color:var(--muted);margin-top:5px}.note{padding:13px;background:#1c354e;color:#a6d3ff;border-radius:12px;font-size:13px;line-height:1.5}
@media(max-width:850px){.app{grid-template-columns:60px 300px minmax(0,1fr)}}@media(max-width:650px){.app{display:block;position:relative}.rail{position:absolute;z-index:4;bottom:0;left:0;right:0;height:65px;flex-direction:row;justify-content:space-around;padding:5px 8px calc(5px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line)}.mark{display:none}.nav.bottom{margin:0}.side{height:calc(100dvh - 65px);border:0}.workspace{display:none;height:100dvh}.app.open .side{display:none}.app.open .workspace{display:flex}.app.open .rail{display:none}.back{display:block}.chathead{height:64px;padding:0 12px}.messages{padding:15px 12px}.bubble{max-width:87%}.page{padding:20px 16px}}
</style><link rel="stylesheet" href="/static/telegram.css?v=10"></head><body>
<section id="auth" class="auth"><div class="authbox"><div class="logo">✦ Losgram</div><p>Твои разговоры. Твой мир.</p><h3 id="mode" style="text-align:center">Войти в аккаунт</h3>
<div id="loginForm"><input id="loginUsername" class="field" placeholder="Имя пользователя" autocomplete="username"><input id="loginPassword" class="field" type="password" placeholder="Пароль" autocomplete="current-password"><button class="primary" id="loginButton">Войти</button></div>
<div id="registerForm" class="hidden"><input id="display" class="field" placeholder="Твоё имя" autocomplete="name"><input id="username" class="field" placeholder="Имя пользователя (латиница)" autocomplete="username"><input id="password" class="field" type="password" placeholder="Пароль (от 8 символов)" autocomplete="new-password"><button class="primary" id="createAccount">Создать аккаунт</button></div>
<button class="link" id="toggle">Создать аккаунт</button><p id="err"></p></div></section>
<main id="app" class="app hidden"><nav class="rail"><div class="mark">✦</div><button class="nav active" data-page="chats" title="Чаты">▣</button><button class="nav" data-page="contacts" title="Контакты">♙</button><button class="nav" data-page="settings" title="Настройки">⚙</button><button class="nav bottom" data-page="profile" title="Профиль">●</button></nav><aside class="side"><header class="sidehead"><div class="brand-avatars" aria-hidden="true"><i> L </i><i> O </i><i> S </i></div><h2 id="heading">Losgram</h2><button class="icon header-lock" id="headerLock" aria-label="Конфиденциальность">♙</button><button class="icon header-more" id="menuToggle" aria-label="Ещё">⋮</button><button class="icon" id="new" aria-label="Создать чат">✎</button></header><input id="filter" class="search" placeholder="⌕  Поиск чатов и людей"><div class="tabs"></div><button class="archive-row" id="archiveRow"><span class="archive-icon">▣</span><span class="archive-copy"><b>Архив чатов</b><small id="archivePreview">Скрытые переписки</small></span><span class="archive-arrow">›</span></button><div id="people" class="list"></div><button class="mobile-compose" id="mobileCompose" aria-label="Новое сообщение">✎</button></aside><section class="workspace"><div id="welcome" class="welcome"><div class="mark">✦</div><h2>Добро пожаловать в Losgram</h2><p>Выбери собеседника, чтобы открыть переписку. Найди друзей через поиск.</p></div><header id="chathead" class="chathead hidden"><button id="back" class="back">‹</button><div id="chatavatar" class="avatar">L</div><div class="chatwho"><b id="chatname"></b><small id="chatstatus">@Losgram</small></div><button id="info" class="icon">⋯</button></header><div id="messages" class="messages hidden"></div><form id="composer" class="composer hidden"><input id="body" placeholder="Написать сообщение..." autocomplete="off"><button class="send">➤</button></form><div id="page" class="page hidden"></div></section></main>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem("losgram_token")||"",me=null,users=[],active=null,rooms=[],roomId=0,last=0,poll=null,reg=false,verifiedPhone="",verificationToken="",listTab="all",showArchived=false;
async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...opt.headers}}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||"Ошибка");return d}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const initial=s=>esc((s||"L").slice(0,1).toUpperCase());
function authError(e){$("err").textContent=e.message}
$("toggle").onclick=()=>{reg=!reg;$("loginForm").classList.toggle("hidden",reg);$("registerForm").classList.toggle("hidden",!reg);$("mode").textContent=reg?"Регистрация":"Войти в аккаунт";$("toggle").textContent=reg?"Уже есть аккаунт":"Создать аккаунт";$("err").textContent=""};
$("loginButton").onclick=async()=>{try{let d=await api("/api/login",{method:"POST",body:JSON.stringify({username:$("loginUsername").value.trim(),password:$("loginPassword").value})});token=d.token;localStorage.setItem("losgram_token",token);await start()}catch(e){authError(e)}};
$("loginPassword").onkeydown=e=>{if(e.key==="Enter")$("loginButton").click()};
$("createAccount").onclick=async()=>{try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({display_name:$("display").value.trim(),username:$("username").value.trim(),password:$("password").value})});token=d.token;localStorage.setItem("losgram_token",token);await start()}catch(e){authError(e)}};
$("password").onkeydown=e=>{if(e.key==="Enter")$("createAccount").click()};
async function start(){try{me=await api("/api/me");$("auth").classList.add("hidden");$("app").classList.remove("hidden");users=await api("/api/users");rooms=await api("/api/chats");draw()}catch(e){localStorage.removeItem("losgram_token");token="";$("err").textContent=e.message}}
function chatPrefs(){try{return JSON.parse(localStorage.getItem("losgram_chatprefs_"+(me?.id||""))||"{}")}catch{return {}}}function saveChatPrefs(p){localStorage.setItem("losgram_chatprefs_"+me.id,JSON.stringify(p))}function draw(){let q=$("filter").value.toLowerCase(),prefs=chatPrefs(),shown=rooms.filter(r=>!!prefs[r.id]?.archived===showArchived).sort((a,b)=>Number(!!prefs[b.id]?.pinned)-Number(!!prefs[a.id]?.pinned)),arr=listTab==="people"&&!showArchived?users.filter(u=>(u.username+" "+u.display_name).toLowerCase().includes(q)):[];$("archiveRow").classList.toggle("archive-active",showArchived);$("archiveRow").querySelector("b").textContent=showArchived?"← Назад к чатам":"Архив чатов";$("people").innerHTML=(listTab==="people"?[]:shown).map(r=>'<button class="person" data-room="'+r.id+'"><span class="avatar">'+(r.kind==="global"?"🌐":r.kind==="channel"?"📢":"👥")+'</span><span class="info"><span class="name">'+(prefs[r.id]?.pinned?"📌 ":"")+esc(r.title)+'</span><span class="preview">'+(r.last_message?esc(r.last_message):(r.kind==="global"?"Общий чат":r.kind==="channel"?"Канал":"Группа"))+'</span></span><span class="chat-menu" data-menu="'+r.id+'">⋯</span></button>').join("")+arr.map(u=>'<button class="person '+(active?.username===u.username?"selected":"")+'" data-u="'+esc(u.username)+'"><span class="avatar">'+initial(u.display_name)+'</span><span class="info"><span class="name">'+esc(u.display_name)+'</span><span class="preview">@'+esc(u.username)+'</span></span></button>').join("")||'<div class="empty">Пока нет собеседников.<br>Найди друга по имени пользователя.</div>';document.querySelectorAll(".person[data-u]").forEach(b=>b.onclick=()=>openChat(b.dataset.u));document.querySelectorAll(".person[data-room]").forEach(b=>{b.onclick=e=>{if(e.target.closest("[data-menu]"))return;openRoom(Number(b.dataset.room))};b.oncontextmenu=e=>{e.preventDefault();chatActions(Number(b.dataset.room))}});document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=e=>{e.stopPropagation();chatActions(Number(b.dataset.menu))})}function chatActions(id){let p=chatPrefs(),v=p[id]||{},choice=prompt("Действие: pin — закрепить/открепить; archive — архивировать/вернуть","pin");if(!choice)return;if(choice==="pin")v.pinned=!v.pinned;else if(choice==="archive")v.archived=!v.archived;else return; p[id]=v;saveChatPrefs(p);draw()}
$("menuToggle").onclick=()=>{let action=prompt("Меню Losgram: введи settings для настроек или profile для профиля","settings");if(action==="profile")page("profile");else if(action==="settings")page("settings")};$("headerLock").onclick=()=>alert("Защита аккаунта: используйте надёжный пароль и не передавайте его другим пользователям.");$("filter").oninput=draw;$("mobileCompose").onclick=()=>$("new").click();$("archiveRow").onclick=()=>{showArchived=!showArchived;listTab="all";document.querySelectorAll(".tabs .tab").forEach((x,i)=>x.classList.toggle("active",i===0));draw()};document.querySelectorAll(".tabs .tab").forEach((b,i)=>{b.onclick=()=>{listTab=i===1?"people":"all";document.querySelectorAll(".tabs .tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");draw()}});
$("new").onclick=async()=>{
 let kind=prompt("Что создать? Введи group для группы или channel для ТГК-канала","group");if(!kind)return;
 kind=kind.toLowerCase().trim();if(kind==="тгк"||kind==="канал")kind="channel";if(kind==="группа")kind="group";
 if(!["group","channel"].includes(kind)){alert("Выбери group или channel");return}
 let title=prompt("Название "+(kind==="channel"?"канала":"группы"));if(!title)return;
 let username=prompt("Публичная ссылка (латиница, можно оставить пустой)","");let members=kind==="group"?prompt("Участники через запятую (необязательно)",""):""; 
 try{await api("/api/chats",{method:"POST",body:JSON.stringify({kind,title,username:username||null,is_public:true,members:members?members.split(",").map(x=>x.trim().replace(/^@/,"")).filter(Boolean):[]})});rooms=await api("/api/chats");draw()}
 catch(e){alert(e.message)}
};

async function openChat(n){roomId=0;active=users.find(u=>u.username===n);if(!active)return;last=0;if(poll)clearInterval(poll);$("app").classList.add("open");$("welcome").classList.add("hidden");$("page").classList.add("hidden");$("chathead").classList.remove("hidden");$("messages").classList.remove("hidden");$("composer").classList.remove("hidden");$("chatname").textContent=active.display_name;$("chatavatar").textContent=initial(active.display_name);$("messages").innerHTML="";draw();await load();poll=setInterval(load,2000);$("body").focus()}

async function openRoom(id){
 roomId=id;active=null;last=0;if(poll)clearInterval(poll);
 let room=rooms.find(r=>r.id===id);if(!room)return;
 $("app").classList.add("open");$("welcome").classList.add("hidden");$("page").classList.add("hidden");
 $("chathead").classList.remove("hidden");$("messages").classList.remove("hidden");$("composer").classList.remove("hidden");
 $("chatname").textContent=room.title;$("chatavatar").textContent=room.kind==="global"?"🌐":room.kind==="channel"?"📢":"👥";$("chatstatus").textContent=room.kind==="global"?"Все пользователи Losgram":room.kind==="channel"?(room.is_member?"Вы подписаны":"Публичный канал"):"Групповой чат";
 $("messages").innerHTML="";draw();await load();poll=setInterval(load,2000);$("body").focus()
}
async function load(){if(!active&&!roomId)return;try{let rows=roomId?await api("/api/chats/"+roomId+"/messages?after="+last):await api("/api/messages/"+encodeURIComponent(active.username)+"?after="+last);for(let m of rows){last=Math.max(last,m.id);let e=document.createElement("div");e.className="bubble "+(m.sender_id===me.id?"mine":"");e.dataset.messageId=m.id;e.oncontextmenu=async ev=>{ev.preventDefault();if(!roomId)return;let choice=prompt("Действие: edit — изменить; delete — удалить; react — реакция","react");try{if(choice==="edit"&&m.sender_id===me.id){let body=prompt("Новый текст",m.body);if(body!==null)await api("/api/chats/"+roomId+"/messages/"+m.id,{method:"PATCH",body:JSON.stringify({body})})}else if(choice==="delete"&&m.sender_id===me.id){if(confirm("Удалить это сообщение?"))await api("/api/chats/"+roomId+"/messages/"+m.id,{method:"DELETE"})}else if(choice==="react"){let emoji=prompt("Реакция: 👍 ❤️ 😂 🔥 👏 😮 😢 👎","👍");if(emoji)await api("/api/chats/"+roomId+"/messages/"+m.id+"/reactions",{method:"POST",body:JSON.stringify({emoji})})}else return;last=0;$("messages").innerHTML="";await load()}catch(err){alert(err.message)}};e.textContent=(roomId&&m.sender_id!==me.id?((m.display_name||m.username)+" · "):"")+m.body;let t=document.createElement("div");t.className="time";t.textContent=new Date(m.created_at*1000).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});e.appendChild(t);$("messages").appendChild(e)}if(rows.length)$("messages").scrollTop=$("messages").scrollHeight}catch{}}
$("composer").onsubmit=async e=>{e.preventDefault();let body=$("body").value.trim();if(!body||(!active&&!roomId))return;try{if(roomId)await api("/api/chats/"+roomId+"/messages",{method:"POST",body:JSON.stringify({body})});else await api("/api/messages",{method:"POST",body:JSON.stringify({recipient:active.username,body})});$("body").value="";await load()}catch(e){alert(e.message)}};
$("back").onclick=()=>{if(poll)clearInterval(poll);active=null;roomId=0;$("app").classList.remove("open");$("welcome").classList.remove("hidden");draw()};$("info").onclick=async()=>{if(active){alert(active.display_name+" · @"+active.username);return}let r=rooms.find(x=>x.id===roomId);if(!r)return;if(r.kind==="channel"&&!r.is_member){try{await api("/api/chats/"+roomId+"/join",{method:"POST"});rooms=await api("/api/chats");alert("Вы подписались на канал");await openRoom(roomId)}catch(e){alert(e.message)}return}if(r.kind==="group"&&r.owner_id===me.id){let names=prompt("Имена пользователей через запятую");if(names)try{await api("/api/chats/"+roomId+"/members",{method:"POST",body:JSON.stringify({usernames:names.split(",").map(x=>x.trim().replace(/^@/,"")).filter(Boolean)})});rooms=await api("/api/chats");alert("Участники добавлены")}catch(e){alert(e.message)}return}alert(r.title)};

function localSettings(){try{return JSON.parse(localStorage.getItem("losgram_settings_"+(me?.id||""))||"{}")}catch{return {}}}
function saveSettings(s){localStorage.setItem("losgram_settings_"+me.id,JSON.stringify(s))}
function applySettings(){let s=localSettings();document.documentElement.dataset.theme=s.theme||"dark";document.documentElement.style.setProperty("--font-scale",s.fontSize||"1");document.body.classList.toggle("compact-mode",!!s.compact);document.body.classList.toggle("reduce-motion",!!s.reduceMotion)}
function renderSettings(){
 let s=localSettings(),checked=(k,def=false)=>(s[k]??def)?"checked":"";
 $("page").innerHTML='<h2>Настройки</h2><p class="muted settings-intro">Управляй аккаунтом и работой Losgram на этом устройстве.</p>'+
 '<section class="settings-section"><h3>Аккаунт</h3><div class="settings-row"><span class="settings-symbol">👤</span><div class="settings-copy"><b>Профиль</b><small>'+esc(me.display_name)+' · @'+esc(me.username)+'</small></div><button class="settings-action" data-setting-action="profile">Открыть</button></div><div class="settings-row"><span class="settings-symbol">🔒</span><div class="settings-copy"><b>Конфиденциальность</b><small>Настройки видимости и прочтения</small></div><button class="settings-action" data-setting-action="privacy">Настроить</button></div></section>'+
 '<section class="settings-section"><h3>Оформление</h3><label class="settings-row"><span class="settings-symbol">🌗</span><span class="settings-copy"><b>Тема</b><small>Цвет интерфейса</small></span><select id="settingTheme" class="settings-select"><option value="dark">Тёмная</option><option value="black">Чёрная</option><option value="light">Светлая</option></select></label><label class="settings-row"><span class="settings-symbol">🔤</span><span class="settings-copy"><b>Размер текста</b><small>Масштаб текста</small></span><select id="settingFont" class="settings-select"><option value="0.9">Маленький</option><option value="1">Обычный</option><option value="1.1">Большой</option><option value="1.2">Очень большой</option></select></label><label class="settings-toggle"><span><b>Компактный список чатов</b><small>Уменьшить высоту строк</small></span><input type="checkbox" data-pref="compact" '+checked("compact")+'></label><label class="settings-toggle"><span><b>Уменьшить анимацию</b><small>Сократить движение интерфейса</small></span><input type="checkbox" data-pref="reduceMotion" '+checked("reduceMotion")+'></label></section>'+
 '<section class="settings-section"><h3>Уведомления</h3><label class="settings-toggle"><span><b>Уведомления</b><small>Настройка интерфейса</small></span><input type="checkbox" data-pref="notifications" '+checked("notifications",true)+'></label><label class="settings-toggle"><span><b>Звуки</b><small>Если поддерживаются браузером</small></span><input type="checkbox" data-pref="sounds" '+checked("sounds",true)+'></label><label class="settings-toggle"><span><b>Предпросмотр сообщений</b><small>Текст последнего сообщения в списке</small></span><input type="checkbox" data-pref="previews" '+checked("previews",true)+'></label></section>'+
 '<section class="settings-section"><h3>Данные и хранение</h3><label class="settings-toggle"><span><b>Экономия трафика</b><small>Предпочитать облегчённую загрузку медиа</small></span><input type="checkbox" data-pref="dataSaver" '+checked("dataSaver")+'></label><div class="settings-row"><span class="settings-symbol">🧹</span><div class="settings-copy"><b>Сбросить настройки устройства</b><small>Очистить локальные параметры</small></div><button class="settings-action danger" data-setting-action="reset">Сбросить</button></div></section>'+
 '<section class="settings-section"><h3>Безопасность</h3><div class="settings-row"><span class="settings-symbol">🛡️</span><div class="settings-copy"><b>Активный аккаунт</b><small>@'+esc(me.username)+' · вход выполнен</small></div></div><p class="settings-hint">Не сообщай пароль и токен входа другим людям. Управление сеансами и смена пароля пока не подключены.</p></section>'+
 '<button id="logout" class="primary settings-logout">Выйти из аккаунта</button><p class="settings-version">Losgram · параметры сохраняются на этом устройстве</p>';
 $("settingTheme").value=s.theme||"dark";$("settingFont").value=s.fontSize||"1";
 $("settingTheme").onchange=e=>{s.theme=e.target.value;saveSettings(s);applySettings()};
 $("settingFont").onchange=e=>{s.fontSize=e.target.value;saveSettings(s);applySettings()};
 document.querySelectorAll("#page [data-pref]").forEach(el=>el.onchange=()=>{s[el.dataset.pref]=el.checked;saveSettings(s);applySettings()});
 document.querySelectorAll("#page [data-setting-action]").forEach(el=>el.onclick=()=>{let a=el.dataset.settingAction;if(a==="profile")page("profile");if(a==="privacy")renderPrivacy();if(a==="reset"&&confirm("Сбросить настройки на этом устройстве?")){localStorage.removeItem("losgram_settings_"+me.id);applySettings();renderSettings()}});
 $("logout").onclick=()=>{if(confirm("Выйти из аккаунта?")){localStorage.removeItem("losgram_token");location.reload()}};
}
function renderPrivacy(){let s=localSettings();$("page").innerHTML='<button class="settings-action" id="settingsBack">← Настройки</button><h2>Конфиденциальность</h2><p class="muted">Пока эти параметры хранятся на устройстве и не меняют серверную видимость аккаунта.</p><section class="settings-section"><label class="settings-toggle"><span><b>Предпросмотр сообщений</b><small>Показывать текст в списке чатов</small></span><input type="checkbox" data-pref="previews" '+(s.previews===false?"":"checked")+'></label><label class="settings-toggle"><span><b>Уведомления</b><small>Настройка интерфейса</small></span><input type="checkbox" data-pref="notifications" '+(s.notifications===false?"":"checked")+'></label></section><p class="settings-hint">Статусы «был(а) недавно», блокировка и двухэтапная проверка ещё не реализованы.</p>';$("settingsBack").onclick=renderSettings;document.querySelectorAll("#page [data-pref]").forEach(el=>el.onchange=()=>{s[el.dataset.pref]=el.checked;saveSettings(s)})}
function page(p){active=null;if(poll)clearInterval(poll);$("app").classList.remove("open");$("welcome").classList.add("hidden");$("chathead").classList.add("hidden");$("messages").classList.add("hidden");$("composer").classList.add("hidden");$("page").classList.remove("hidden");document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("heading").textContent=({chats:"Сообщения",contacts:"Контакты",calls:"Звонки",stars:"Звёзды",settings:"Настройки",profile:"Профиль"})[p]||"Losgram";if(p==="chats"){$("page").classList.add("hidden");$("welcome").classList.remove("hidden");return}if(p==="profile")$("page").innerHTML='<h2>Профиль</h2><div class="row"><div><b>'+esc(me.display_name)+'</b><small>@'+esc(me.username)+'</small></div><span class="avatar">'+initial(me.display_name)+'</span></div><p class="note">Профиль Losgram</p>';else if(p==="contacts")$("page").innerHTML='<h2>Контакты</h2><p class="muted">Пользователи Losgram</p>'+users.map(u=>'<div class="row"><div style="display:flex;align-items:center;gap:12px"><span class="avatar">'+initial(u.display_name)+'</span><div><b>'+esc(u.display_name)+'</b><small>@'+esc(u.username)+'</small></div></div><button class="icon" data-u="'+esc(u.username)+'">➤</button></div>').join("");else if(p==="stars")$("page").innerHTML='<h2>⭐ Звёзды Losgram</h2><p class="muted">Покупка отключена: платёжный провайдер не подключён.</p>';else if(p==="calls")$("page").innerHTML='<h2>Звонки</h2><p class="muted">Голосовые и видеозвонки пока не подключены к серверу.</p>';else if(p==="settings")renderSettings();else $("page").innerHTML='<h2>Раздел</h2>';document.querySelectorAll("#page [data-u]").forEach(b=>b.onclick=()=>openChat(b.dataset.u))}
applySettings();

document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>page(b.dataset.page));if(token)start();
</script></body></html>
