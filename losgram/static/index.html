<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Losgram</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1621;color:#f5f7fa;font:15px system-ui}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(100%,390px);background:#17212b;padding:28px;border-radius:22px}.logo{text-align:center;font-size:32px;font-weight:850;margin-bottom:8px}.muted{color:#8b9bab}.box input,.search input,.composer input{width:100%;background:#202b36;border:1px solid #263442;border-radius:12px;padding:13px;color:white;margin:7px 0}.primary{width:100%;background:#3390ec;padding:13px;border-radius:12px;margin-top:8px;font-weight:bold}.link{display:block;background:none;color:#69aef5;margin:15px auto}.app{height:100vh;max-width:1100px;margin:auto;display:grid;grid-template-columns:330px 1fr;background:#17212b}.side{border-right:1px solid #263442;overflow:auto}.head{padding:18px;font-size:22px;font-weight:800}.person{width:100%;display:flex;gap:12px;align-items:center;padding:14px;background:none;text-align:left;border-top:1px solid #ffffff0c}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#426d9a}.chat{display:flex;flex-direction:column;min-width:0}.chathead{padding:20px;border-bottom:1px solid #263442;font-weight:bold}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:9px}.bubble{padding:10px 13px;background:#202d3a;border-radius:14px;max-width:78%;align-self:flex-start;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#2b5278}.composer{display:flex;gap:8px;padding:12px}.composer input{margin:0;border-radius:25px}.send{background:#3390ec;border-radius:50%;width:48px}@media(max-width:650px){.app{grid-template-columns:1fr}.chat{display:none}.app.open .side{display:none}.app.open .chat{display:flex}.back{display:inline!important}}.back{display:none;background:none}
</style></head><body><section id="auth" class="auth"><div class="box"><div class="logo">✦ Losgram</div><p class="muted" style="text-align:center">Твои разговоры. Твой мир.</p><div id="mode">Войти</div><input id="display" class="hidden" placeholder="Имя"><input id="username" placeholder="Имя пользователя"><input id="password" type="password" placeholder="Пароль (от 8 символов)"><button class="primary" id="submit">Войти</button><button class="link" id="toggle">Создать аккаунт</button><p id="err" class="muted"></p></div></section><main id="app" class="app hidden"><aside class="side"><div class="head">✦ Losgram <span class="muted" id="self" style="font-size:12px"></span></div><div class="search" style="padding:0 12px"><input id="filter" placeholder="Поиск пользователей"></div><div id="people"></div></aside><section class="chat"><header class="chathead"><button class="back" id="back">‹ </button><span id="chatname">Выбери собеседника</span></header><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="body" placeholder="Сообщение..." disabled><button class="send" disabled id="send">➤</button></form></section></main><script>
const $=x=>document.getElementById(x);let token=localStorage.getItem("losgram_token")||"",me=null,users=[],active=null,last=0,poll=null,reg=false;
async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...opt.headers}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||"Ошибка");return d}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("toggle").onclick=()=>{reg=!reg;$("display").classList.toggle("hidden",!reg);$("mode").textContent=reg?"Регистрация":"Войти";$("submit").textContent=reg?"Создать аккаунт":"Войти";$("toggle").textContent=reg?"Уже есть аккаунт":"Создать аккаунт";$("err").textContent=""};
$("submit").onclick=async()=>{try{let d=await api(reg?"/api/register":"/api/login",{method:"POST",body:JSON.stringify({username:$("username").value.trim(),password:$("password").value,display_name:$("display").value})});token=d.token;localStorage.setItem("losgram_token",token);await start()}catch(e){$("err").textContent=e.message}};
async function start(){try{me=await api("/api/me");$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("self").textContent="@"+me.username;users=await api("/api/users");draw()}catch(e){token="";localStorage.removeItem("losgram_token")}}
function draw(){let q=$("filter").value.toLowerCase();$("people").innerHTML=users.filter(u=>(u.username+u.display_name).toLowerCase().includes(q)).map(u=>'<button class="person" data-u="'+esc(u.username)+'"><span class="avatar">'+esc(u.display_name[0])+'</span><span><b>'+esc(u.display_name)+'</b><br><small class="muted">@'+esc(u.username)+'</small></span></button>').join("")||'<p class="muted" style="padding:14px">Пока нет других пользователей. Пригласи друга зарегистрироваться.</p>';document.querySelectorAll(".person").forEach(b=>b.onclick=()=>openChat(b.dataset.u))}
$("filter").oninput=draw;
async function openChat(n){active=users.find(u=>u.username===n);last=0;$("chatname").textContent=active.display_name+" · @"+n;$("body").disabled=false;$("send").disabled=false;$("app").classList.add("open");$("messages").innerHTML="";await load();if(poll)clearInterval(poll);poll=setInterval(load,1800)}
async function load(){if(!active)return;try{let rows=await api("/api/messages/"+encodeURIComponent(active.username)+"?after="+last);for(let m of rows){last=Math.max(last,m.id);let e=document.createElement("div");e.className="bubble "+(m.sender_id===me.id?"mine":"");e.textContent=m.body;$("messages").appendChild(e)}if(rows.length)$("messages").scrollTop=$("messages").scrollHeight}catch{}}
$("composer").onsubmit=async e=>{e.preventDefault();let body=$("body").value.trim();if(!body||!active)return;try{await api("/api/messages",{method:"POST",body:JSON.stringify({recipient:active.username,body})});$("body").value="";await load()}catch(e){alert(e.message)}};
$("back").onclick=()=>{$("app").classList.remove("open");active=null;if(poll)clearInterval(poll)};
if(token)start();
</script></body></html>
